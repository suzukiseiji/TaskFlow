<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>TaskFlow</title>
    <script>
      try {
        const mode = localStorage.getItem('@taskflow:mode') || 'dark';
        const styleTheme = localStorage.getItem('@taskflow:styleTheme') || 'default';
        if (mode === 'dark') document.documentElement.classList.add('dark');
        if (styleTheme !== 'default') document.documentElement.classList.add(styleTheme);
      } catch (e) {}
    </script>
  </head>
  <body class="antialiased selection:bg-primary-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
